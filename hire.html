<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire Damie | Atoyebi Damilare</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/jpg" href="logo.jpg" />
  </head>
  <body class="hire-body">
    <section class="hire-me">
      <h2>Hire Damie</h2>
      <p>
        Looking to collaborate, offer a contract, or a permanent role? Fill this
        short form and let's connect!
      </p>

      <form
        action="https://formspree.io/f/xldeylye"
        method="post"
        class="hire-form"
        id="hire-form"
      >
        <label>
          Full Name
          <input
            type="text"
            name="name"
            placeholder="Your name or company"
            required
          />
        </label>

        <label>
          Phone
          <input type="tel" name="phone" placeholder="+234..." required />
        </label>

        <label>
          Email (optional)
          <input type="email" name="email" placeholder="example@mail.com" />
        </label>

        <label>
          I'm interested in
          <select name="type" required>
            <option value="" disabled selected>Select an option</option>
            <option value="collaboration">Collaboration</option>
            <option value="contract">Contract</option>
            <option value="fulltime">Permanent Role</option>
          </select>
        </label>

        <label>
          Message
          <textarea
            name="message"
            placeholder="Tell me a bit about your project or idea"
            required
          ></textarea>
        </label>

        <button type="submit">Send Request</button>
      </form>
    </section>

    <script>
      const hireForm = document.getElementById("hire-form");
      hireForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        fetch(this.action, {
          method: this.method,
          body: formData,
          headers: { Accept: "application/json" },
        })
          .then((response) => {
            if (response.ok) {
              alert(
                `Thanks ${data.name}! Your request has been sent — Damie will get back to you soon.`,
              );
              this.reset();
            } else {
              return response.json().then((resData) => {
                if (Object.hasOwn(resData, "errors")) {
                  alert(
                    resData.errors.map((error) => error.message).join(", "),
                  );
                } else {
                  alert("Oops! There was a problem submitting your form.");
                }
              });
            }
          })
          .catch((error) => {
            alert("An unexpected error occurred. Please try again.");
            console.error("Fetch error:", error);
          });
      });
    </script>
  </body>
</html>
